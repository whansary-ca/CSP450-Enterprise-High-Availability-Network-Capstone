#!/usr/sbin/nft -f

# CSP450 Stage 4 router firewall/NAT configuration
# Training/lab configuration retained as implemented for failover validation.

flush ruleset

table inet filter {
 chain input {
  type filter hook input priority 0;
  policy accept;
 }
 chain forward {
  type filter hook forward priority 0;
  policy accept;
 }
 chain output {
  type filter hook output priority 0;
  policy accept;
 }
}

table ip nat {
 chain postrouting {
  type nat hook postrouting priority 100;
  policy accept;
  ip saddr 172.16.0.0/16 oifname "ens33" masquerade
 }
}
