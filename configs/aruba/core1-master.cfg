! CSP450 Stage 4 - Aruba 6300 Core 1 (preferred VRRP master)
conf t
hostname podA-6300-1-Core-Master

vlan 404
 name walid-vlan404
exit
vlan 420
 name abdul-vlan420
exit

spanning-tree
spanning-tree priority 0
router vrrp enable

interface 1/1/1
 no shutdown
 no routing
 vlan trunk native 1
 vlan trunk allowed 404,420
exit

interface 1/1/2
 no shutdown
 no routing
 vlan trunk native 1
 vlan trunk allowed 404,420
exit

interface 1/1/3
 no shutdown
 routing
 ip address 192.168.6.81/30
 ip ospf 1 area 0.0.0.0
 ip ospf network point-to-point
exit

interface vlan 404
 no shutdown
 ip address 172.16.101.2/26
 ip ospf 1 area 0.0.0.0
 vrrp 4 address-family ipv4
  address 172.16.101.1 primary
  priority 110
  no shutdown
  exit
exit

interface vlan 420
 no shutdown
 ip address 172.16.105.2/26
 ip ospf 1 area 0.0.0.0
 vrrp 20 address-family ipv4
  address 172.16.105.1 primary
  priority 110
  no shutdown
  exit
exit

router ospf 1
 router-id 1.1.1.1
 area 0.0.0.0
exit

dhcp-server vrf default
 pool vlan404
  range 172.16.101.10 172.16.101.35 prefix-len 26
  default-router 172.16.101.1
  dns-server 10.101.100.21
 exit
 pool vlan420
  range 172.16.105.10 172.16.105.35 prefix-len 26
  default-router 172.16.105.1
  dns-server 10.101.100.21
 exit
 enable
exit
end
