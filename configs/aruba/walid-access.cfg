! CSP450 Stage 4 - Aruba 6300 Walid access switch
conf t
hostname podA-6300-3-Walid-Access

vlan 404
 name walid-vlan404
exit
vlan 420
 name abdul-vlan420
exit

spanning-tree
spanning-tree priority 8

interface 1/1/1
 no shutdown
 no routing
 vlan trunk native 1
 vlan trunk allowed 404,420
exit

interface 1/1/2
 no shutdown
 no routing
 vlan trunk native 1
 vlan trunk allowed 404,420
exit

interface 1/1/3
 no shutdown
 no routing
 vlan access 404
exit

interface 1/1/4
 shutdown
 no routing
 vlan access 1
exit
end
